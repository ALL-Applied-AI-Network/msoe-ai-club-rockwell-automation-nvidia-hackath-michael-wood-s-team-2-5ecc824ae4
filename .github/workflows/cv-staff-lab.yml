name: CV staff lab checks

permissions:
  contents: read

on:
  push:
    branches:
      - release/uwm-lab-2026-10-30
  pull_request:
    paths:
      - "configs/cameras/**"
      - "configs/lab/**"
      - "docs/components/cv-*.md"
      - "scripts/lab_*.py"
      - "scripts/staff_lab.py"
      - "tests/**"
      - "vialcv/**"
      - "requirements*.txt"
      - "pytest.ini"
      - ".github/workflows/cv-staff-lab.yml"

jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
